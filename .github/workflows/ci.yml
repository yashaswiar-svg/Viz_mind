name: VizMind CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-backend:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vizmind
          POSTGRES_PASSWORD: vizmind_password
          POSTGRES_DB: vizmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://vizmind:vizmind_password@localhost:5432/vizmind_test
          JWT_SECRET_KEY: ci_secret_key_1234567890_test_only
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://vizmind:vizmind_password@localhost:5432/vizmind_test
          JWT_SECRET_KEY: ci_secret_key_1234567890_test_only
          AUTH_ENABLED: "true"
          AUTH_TEST_BYPASS: "false"
        run: |
          python -m pytest tests/ -v

  test-frontend:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

