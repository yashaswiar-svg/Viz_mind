services:
  db:
    image: postgres:16-alpine
    container_name: vizmind_db
    restart: always
    environment:
      POSTGRES_USER: vizmind
      POSTGRES_PASSWORD: vizmind_password
      POSTGRES_DB: vizmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizmind -d vizmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: vizmind_backend
    restart: always
    environment:
      - APP_NAME=VizMind
      - APP_ENV=production
      - DEBUG=false
      - API_PREFIX=/api
      - API_VERSION=v1
      - DATABASE_URL=postgresql+asyncpg://vizmind:vizmind_password@db:5432/vizmind
      - JWT_SECRET_KEY=production_secret_key_change_me_in_prod_env_file_12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - AUTH_ENABLED=true
      - AUTH_TEST_BYPASS=false
      - CORS_ORIGINS=["http://localhost","http://localhost:5173","http://localhost:80"]
    volumes:
      - vizmind_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health/ready\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: vizmind_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  vizmind_storage:

